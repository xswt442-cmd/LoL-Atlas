name: Tags

on:
  push:
    tags:
      - "v*"
      - "patch-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: tag
        run: npm run tag:validate -- "$GITHUB_REF_NAME"
      - run: npm run ci
      - if: steps.tag.outputs.kind == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: lol-atlas-${{ steps.tag.outputs.version }}
          path: dist/
      - if: steps.tag.outputs.kind == 'patch'
        uses: actions/upload-artifact@v4
        with:
          name: lol-patch-${{ steps.tag.outputs.version }}
          path: data/releases/${{ steps.tag.outputs.version }}/
