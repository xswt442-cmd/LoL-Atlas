name: Deploy

# App releases (v*) and data releases (patch-*) both change what the site
# serves, so both publish to the same Worker. Branch pushes never deploy;
# re-publish an existing release with the manual "Run workflow" button.
on:
  push:
    tags:
      - "v*"
      - "patch-*"
  workflow_dispatch:

permissions:
  contents: read

# Queue releases instead of cancelling them, so a half-finished publish is
# never left behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lol-atlas.xswt.fyi
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        run: |
          missing=""
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secret(s):$missing. See README.md section '开发与部署'."
            exit 1
          fi
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run tag:validate -- "$GITHUB_REF_NAME"
      # Same gate as CI: typecheck, lint, data:validate, test, build.
      - run: npm run ci
      # `npm run ci` already produced dist/, so publish it rather than
      # rebuilding through `npm run deploy`.
      - name: Publish to Cloudflare Workers
        run: ./node_modules/.bin/wrangler deploy --config dist/server/wrangler.json
