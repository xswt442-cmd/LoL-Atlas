name: Deploy

# Release tags publish the site: v* is an app release, patch-* is a League data
# release, and both change what the deployed Worker serves (the site reads
# public/data/lol.json). Branch pushes never deploy; re-publish an existing
# release with the manual "Run workflow" button.
on:
  push:
    tags:
      - "v*"
      - "patch-*"
  workflow_dispatch:

permissions:
  contents: read

# Queue releases instead of cancelling them, so a half-finished publish is
# never left behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lol-atlas.xswt.fyi
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify release tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: npm run tag:validate -- "$GITHUB_REF_NAME"
      # Same gate as CI: typecheck, lint, data:validate, test, build.
      - run: npm run ci
      # Keep the release artifact independent of publishing, so a missing
      # Cloudflare secret still leaves a downloadable build behind.
      - if: steps.tag.outputs.kind == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: lol-atlas-${{ steps.tag.outputs.version }}
          path: dist/
      - if: steps.tag.outputs.kind == 'patch'
        uses: actions/upload-artifact@v4
        with:
          name: lol-patch-${{ steps.tag.outputs.version }}
          path: data/releases/${{ steps.tag.outputs.version }}/
      - name: Check Cloudflare credentials
        run: |
          missing=""
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secret(s):$missing. See README.md section '开发与部署'."
            exit 1
          fi
      # `npm run ci` already produced dist/, so publish it rather than
      # rebuilding through `npm run deploy`.
      - name: Publish to Cloudflare Workers
        run: ./node_modules/.bin/wrangler deploy --config dist/server/wrangler.json
