name: Deploy

# 发布 tag 才会真正发站点：v* 是应用版本，patch-* 是 League 数据版本，两者都会改变
# 线上 Worker 提供的内容（站点读 public/data/lol.json）。推分支不会部署；
# 想重发已有的 tag，用手动的 "Run workflow" 按钮。
on:
  push:
    tags:
      - "v*"
      - "patch-*"
  workflow_dispatch:

# 建 Release 那一步需要 `contents: write`；除此之外这个 token 不作他用，
# 所以其余环节实质上仍只读。
permissions:
  contents: write

# 发布排队而不是互相取消，避免留下一次发到一半的部署。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lol-atlas.xswt.fyi
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify release tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: npm run tag:validate -- "$GITHUB_REF_NAME"
      # 与 CI 同一道门：typecheck、lint、data:validate、test、build。
      - run: npm run ci
      # 把发布产物与推送到 Cloudflare 解耦：即使缺了 Cloudflare 的 secret，
      # 也还留着一份能下载的构建。
      - if: steps.tag.outputs.kind == 'app'
        uses: actions/upload-artifact@v7
        with:
          name: lol-atlas-${{ steps.tag.outputs.version }}
          path: dist/
      - if: steps.tag.outputs.kind == 'patch'
        uses: actions/upload-artifact@v7
        with:
          name: lol-patch-${{ steps.tag.outputs.version }}
          path: data/releases/${{ steps.tag.outputs.version }}/
      - name: Check Cloudflare credentials
        run: |
          missing=""
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secret(s):$missing. See README.md section '开发与部署'."
            exit 1
          fi
      # `npm run ci` 已经产出 dist/，直接发布它，不要再用 `npm run deploy` 重建一遍。
      - name: Publish to Cloudflare Workers
        run: ./node_modules/.bin/wrangler deploy --config dist/server/wrangler.json
      # v0.1.2 发出去时没有对应的 GitHub Release —— 当时没有任何环节去建它，tag 只发了站点。
      # 现在在这里补上，且放在站点发布之后：失败的部署永远不会留下一个 Release。
      # 重跑时先探测 Release 是否存在，而不是因为已存在就报错。
      - name: Create the GitHub release
        if: steps.tag.outputs.kind == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "LOL Atlas $GITHUB_REF_NAME" \
              --generate-notes
          fi
