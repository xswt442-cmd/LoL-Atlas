name: CI

on:
  push:
  pull_request:

jobs:
  web:
    # Windows keeps the type/lint/test signal — the project is developed there —
    # without paying for a second full build. The bundle is only ever produced on
    # Linux, which is also what Deploy publishes from.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: true
          - os: windows-latest
            build: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.build
        run: npm run ci
      - if: ${{ !matrix.build }}
        run: npm run check

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e pipeline
      - run: python -m unittest discover -s pipeline/tests
