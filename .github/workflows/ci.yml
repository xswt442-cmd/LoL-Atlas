name: CI

on:
  push:
  pull_request:

jobs:
  web:
    # Windows 只保留类型/风格/测试这几路信号 —— 项目是在 Windows 上开发的 ——
    # 但不再为一次没人发布的完整构建付费。产物只在 Linux 上生成，Deploy 也从那里发布。
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build: true
          - os: windows-latest
            build: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.build
        run: npm run ci
      - if: ${{ !matrix.build }}
        run: npm run check

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e pipeline
      - run: python -m unittest discover -s pipeline/tests
