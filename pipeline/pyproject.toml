[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-atlas-pipeline"
version = "0.1.0"
description = "Reproducible data pipeline for LOL Atlas releases."
requires-python = ">=3.12"

[project.scripts]
lol-atlas-data = "lol_atlas_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
